<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目群详情 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body { background:#f0f2f5; }
    .page-wrap { padding:20px; }
    .section { background:#fff; border-radius:6px; padding:16px 20px; margin-bottom:16px; }
    .section h6 { color:#1677ff; border-left:3px solid #1677ff; padding-left:8px; margin-bottom:14px; }
    .info-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 24px; font-size:14px; }
    .info-grid .label { color:#999; }
    .status-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
    .pg-planning { background:#f5f5f5; color:#999; }
    .pg-active { background:#e6f4ff; color:#1677ff; }
    .pg-suspended { background:#fff7e6; color:#faad14; }
    .pg-closed { background:#f0f0f0; color:#888; }
    .pg-unknown { background:#f5f5f5; color:#999; }
    .pr-planning { background:#f5f5f5; color:#999; }
    .pr-in_progress { background:#e6f4ff; color:#1677ff; }
    .pr-delivered { background:#f6ffed; color:#52c41a; }
    .pr-closed { background:#f0f0f0; color:#888; }
    .pr-unknown { background:#f5f5f5; color:#999; }
    .progress { height:8px; background:#eee; border-radius:4px; overflow:hidden; }
    .progress .bar { height:100%; background:#1677ff; border-radius:4px; }
    .charter-box { background:#fafafa; border:1px solid #f0f0f0; border-radius:6px; padding:12px 14px; font-size:14px; white-space:pre-wrap; line-height:1.7; }
    .empty-row td { text-align:center; color:#999; padding:32px 0; }
    /* 里程碑时间线（批C：planned蓝/achieved绿/delayed红） */
    .ms-item { display:flex; gap:12px; position:relative; padding:0 0 16px; }
    .ms-item::before { content:''; position:absolute; left:5px; top:16px; bottom:-2px; width:2px; background:#f0f0f0; }
    .ms-item:last-child { padding-bottom:0; }
    .ms-item:last-child::before { display:none; }
    .ms-dot { flex:none; width:12px; height:12px; border-radius:50%; margin-top:5px; }
    .ms-dot.st-planned { background:#1677ff; }
    .ms-dot.st-achieved { background:#52c41a; }
    .ms-dot.st-delayed { background:#ff4d4f; }
    .ms-body { flex:1; min-width:0; }
    .ms-title { font-weight:600; }
    .ms-meta { font-size:12px; color:#999; margin:2px 0 6px; }
    .ms-lv { display:inline-block; background:#f0f5ff; color:#3f6ef5; border-radius:9px; padding:0 8px; font-size:11px; margin-left:6px; }
    .ms-overdue { display:inline-block; background:#fff7e6; color:#fa8c16; border-radius:9px; padding:0 8px; font-size:11px; margin-left:6px; }
    .msb-planned { background:#e6f4ff; color:#1677ff; }
    .msb-achieved { background:#f6ffed; color:#52c41a; }
    .msb-delayed { background:#fff1f0; color:#ff4d4f; }
  </style>
</head>
<body>
  <div class="page-wrap">

    <div id="layerTip" class="alert alert-warning d-none" style="font-size:13px;"></div>

    <!-- 基本信息 + 章程 -->
    <div class="section d-none" id="headSection">
      <div class="d-flex align-items-center flex-wrap" style="gap:10px;">
        <h5 class="mb-0" id="pName">项目群详情</h5>
        <span id="pStatus"></span>
        <div class="ms-auto text-end">
          <div style="font-size:12px;color:#999;">群内进度均值（<span id="pCount">0</span> 个项目）</div>
          <div style="font-size:26px;font-weight:700;color:#1677ff;"><span id="pAvg">0</span>%</div>
        </div>
      </div>
      <div class="info-grid mt-3">
        <div><span class="label">编号：</span>#<span id="pId"></span></div>
        <div><span class="label">关联战略：</span><span id="pStrategy"></span></div>
        <div><span class="label">群经理：</span><span id="pManager"></span></div>
        <div><span class="label">起止日期：</span><span id="pRange"></span></div>
        <div><span class="label">创建时间：</span><span id="pCreated"></span></div>
        <div><span class="label">更新时间：</span><span id="pUpdated"></span></div>
      </div>
      <div class="progress mt-2"><div class="bar" id="pAvgBar" style="width:0%;"></div></div>
      <div class="mt-3">
        <h6>项目群章程</h6>
        <div class="charter-box" id="pCharter">（未填写章程）</div>
      </div>
      <button class="btn btn-sm btn-outline-secondary mt-3" id="backBtn">← 返回项目群列表</button>
    </div>

    <!-- 成员项目列表 -->
    <div class="section d-none" id="projSection">
      <h6>成员项目（<span id="projCount">0</span>）</h6>
      <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:90px;">编号</th>
              <th>名称</th>
              <th style="width:90px;">状态</th>
              <th style="width:70px;">优先级</th>
              <th style="width:220px;">进度（Case 完成/总数）</th>
              <th style="width:90px;">操作</th>
            </tr>
          </thead>
          <tbody id="projTbody">
            <tr class="empty-row"><td colspan="6">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 里程碑时间线（批C：群直属+成员项目聚合，AC-F2.6） -->
    <div class="section d-none" id="msSection">
      <div class="d-flex align-items-center mb-2">
        <h6 class="mb-0" style="flex:1;">里程碑时间线（群直属 + 成员项目，按目标日期排序）</h6>
        <button id="msNewBtn" class="btn btn-primary btn-sm">+ 新建里程碑（本群）</button>
      </div>
      <div id="msTimeline"><div class="text-center text-muted py-3">加载中...</div></div>
    </div>

    <div class="section" id="loadingSection">
      <div class="text-center text-muted py-4">加载中...</div>
    </div>
  </div>

  <!-- 新建/编辑里程碑弹窗（两级归属自动带入本群） -->
  <div class="modal fade" id="msModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="msModalTitle">新建里程碑</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="msFId">
        <input type="hidden" id="msFOwnerType">
        <input type="hidden" id="msFOwnerId">
        <div class="mb-2"><label class="form-label small">归属（自动带入）</label><input id="msFOwnerDisplay" class="form-control form-control-sm" readonly></div>
        <div class="mb-2"><label class="form-label small">标题 <span class="text-danger">*</span></label><input id="msFTitle" class="form-control form-control-sm" maxlength="200" placeholder="如：接口联调完成"></div>
        <div class="row">
          <div class="col-4 mb-2"><label class="form-label small">目标日期</label><input type="date" id="msFTarget" class="form-control form-control-sm"></div>
          <div class="col-4 mb-2"><label class="form-label small">负责人</label><input id="msFOwner" class="form-control form-control-sm" maxlength="50" placeholder="如：张三"></div>
          <div class="col-4 mb-2"><label class="form-label small">阻碍项（blocker）</label><input id="msFBlocker" class="form-control form-control-sm" maxlength="200" placeholder="无"></div>
        </div>
        <div class="mb-2"><label class="form-label small">描述</label><textarea id="msFDesc" class="form-control form-control-sm" rows="2" maxlength="1000"></textarea></div>
        <div class="mb-0 d-none" id="msSubRow">
          <label class="form-label small mb-1">涉及成员项目（群级里程碑多选，仅展示用）</label>
          <div id="msSubList" style="max-height:140px;overflow:auto;border:1px solid #eee;border-radius:6px;padding:8px 12px;"></div>
        </div>
        <div class="text-muted mt-2" style="font-size:12px;">状态流转：planned→achieved（达成确认，记达成日期）/ delayed；achieved 可撤销回 planned；逾期仅黄标提示，系统不改状态。</div>
      </div>
      <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button><button id="msSaveBtn" class="btn btn-primary btn-sm">保存</button></div>
    </div></div>
  </div>

  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(function () {
      const API = window.EAISELP_API;
      const CFG = window.EAISELP_CONFIG;
      if (!API.getToken()) { location.href = '../' + CFG.LOGIN_PAGE; return; }

      const LAYER_TIP = '该层未启用，请联系管理员在分层设置中开启';
      const PG_TEXT = { planning: '规划中', active: '进行中', suspended: '已暂停', closed: '已关闭' };
      const PG_CLASS = { planning: 'pg-planning', active: 'pg-active', suspended: 'pg-suspended', closed: 'pg-closed' };
      const PR_TEXT = { planning: '规划中', in_progress: '进行中', delivered: '已交付', closed: '已关闭' };
      const PR_CLASS = { planning: 'pr-planning', in_progress: 'pr-in_progress', delivered: 'pr-delivered', closed: 'pr-closed' };

      const id = (new URLSearchParams(location.search).get('id') || '').trim();

      function load() {
        if (!id) { showTip('缺少项目群 id 参数'); return; }
        // 详情先渲染；战略名映射异步补齐（L3 关闭时降级显示 #id）
        API.bizGet('/api/v1/programs/' + encodeURIComponent(id)).done(function (resp) {
          if (isLayerOff(resp)) { showTip(); return; }
          if (resp.code !== 0) { showTip(resp.msg || '加载失败'); return; }
          render(resp.data || {});
        }).fail(function (xhr) { showTip((xhr.responseJSON && xhr.responseJSON.msg) || ('请求失败（' + xhr.status + '）')); });
      }

      function isLayerOff(resp) { return resp && (resp.code === 43001 || resp.code === 43002); }
      function showTip(msg) {
        $('#loadingSection').addClass('d-none');
        $('#layerTip').removeClass('d-none').text('⚠ ' + (msg || LAYER_TIP));
      }

      let strategyMap = null;
      let programName = '';
      let memberProjects = [];
      // 兼容 code=0（平台旧壳）与 code=200（批B 契约）
      function okResp(r) { return !!r && (r.code === 0 || r.code === 200); }
      function rmsg(r, d) { return (r && (r.msg || r.message)) || d || '操作失败'; }
      function fillStrategyName(strategyId) {
        const $el = $('#pStrategy').text('#' + strategyId + '（战略层未启用，无法解析名称）');
        API.bizGet('/api/v1/strategies?page=1&size=500&status=all').done(function (resp) {
          if (resp.code !== 0 || !resp.data) return;
          strategyMap = {};
          (resp.data.records || []).forEach(function (s) { strategyMap[s.id] = s.title; });
          $el.text(strategyMap[strategyId] || ('#' + strategyId));
        });
      }

      function render(p) {
        $('#loadingSection').addClass('d-none');
        $('#headSection').removeClass('d-none');
        $('#pName').text(p.name || ('项目群 #' + id));
        programName = p.name || ('项目群 #' + id);
        memberProjects = p.projects || [];
        const st = p.status || 'unknown';
        $('#pStatus').html('<span class="status-badge ' + (PG_CLASS[st] || 'pg-unknown') + '">' + (PG_TEXT[st] || st) + '</span>');
        $('#pId').text(p.id || id);
        $('#pStrategy').text('-');
        if (p.strategyId != null) fillStrategyName(p.strategyId);
        else $('#pStrategy').html('<span class="text-muted">（未关联战略）</span>');
        $('#pManager').text(p.pgmManager || '-');
        $('#pRange').text((p.startDate || p.endDate) ? ((p.startDate || '?') + ' ~ ' + (p.endDate || '?')) : '-');
        $('#pCreated').text(fmtTime(p.createTime));
        $('#pUpdated').text(fmtTime(p.updateTime));
        $('#pCount').text(p.projectCount != null ? p.projectCount : (p.projects ? p.projects.length : 0));
        const avg = p.avgProgress || 0;
        $('#pAvg').text(avg);
        $('#pAvgBar').css('width', Math.min(100, Math.max(0, avg)) + '%');
        $('#pCharter').text(p.charter || '（未填写章程）');

        // 成员项目
        const projects = p.projects || [];
        $('#projSection').removeClass('d-none');
        $('#projCount').text(projects.length);
        if (!projects.length) {
          $('#projTbody').html('<tr class="empty-row"><td colspan="6">暂无成员项目，可在项目管理中将项目挂入本群</td></tr>');
        } else {
          $('#projTbody').html(projects.map(function (pr) {
            const pst = pr.status || 'unknown';
            const prog = pr.progress || 0;
            const done = pr.caseDone != null ? pr.caseDone : 0;
            const total = pr.caseTotal != null ? pr.caseTotal : 0;
            return '<tr>'
              + '<td>#' + escapeHtml(pr.id) + '</td>'
              + '<td><strong>' + escapeHtml(pr.name || '') + '</strong></td>'
              + '<td><span class="status-badge ' + (PR_CLASS[pst] || 'pr-unknown') + '">' + (PR_TEXT[pst] || pst) + '</span></td>'
              + '<td>P' + escapeHtml(pr.priority != null ? pr.priority : '-') + '</td>'
              + '<td><div class="d-flex align-items-center" style="gap:8px;"><div class="progress" style="flex:1;"><div class="bar" style="width:' + Math.min(100, prog) + '%;"></div></div><span style="font-size:12px;color:#1677ff;font-weight:600;white-space:nowrap;">' + prog + '%（' + done + '/' + total + '）</span></div></td>'
              + '<td><button class="btn btn-sm btn-outline-primary proj-view" data-id="' + pr.id + '">详情</button></td>'
              + '</tr>';
          }).join(''));
        }

        // 里程碑时间线（批C）
        loadMilestones();
      }

      $('#projTbody').on('click', '.proj-view', function () {
        goPage('project-detail-' + $(this).data('id'), '项目详情', 'pages/project-detail.html?id=' + $(this).data('id'));
      });
      $('#backBtn').on('click', function () { goPage('program-list', '项目群管理', 'pages/program-list.html'); });

      // ================= 里程碑时间线（批C）=================
      const MS_TEXT = { planned: '规划中', achieved: '已达成', delayed: '已延迟' };
      const MS_CLASS = { planned: 'msb-planned', achieved: 'msb-achieved', delayed: 'msb-delayed' };

      function loadMilestones() {
        $('#msSection').removeClass('d-none');
        const $box = $('#msTimeline').html('<div class="text-center text-muted py-3">加载中...</div>');
        API.bizGet('/api/v1/programs/' + encodeURIComponent(id) + '/milestone-timeline').done(function (resp) {
          if (isLayerOff(resp)) {
            $box.html('<div class="text-muted py-2" style="font-size:13px;">⚠ 里程碑不可用：' + LAYER_TIP + '</div>');
            return;
          }
          if (!okResp(resp)) {
            $box.html('<div class="text-danger py-2" style="font-size:13px;">' + escapeHtml(rmsg(resp, '里程碑加载失败')) + '</div>');
            return;
          }
          renderMilestones(resp.data || []);
        }).fail(function (xhr) {
          $box.html('<div class="text-danger py-2" style="font-size:13px;">' + escapeHtml((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '里程碑加载失败') + '</div>');
        });
      }

      function renderMilestones(list) {
        list.sort(function (a, b) { return String(a.targetDate || '').localeCompare(String(b.targetDate || '')); });
        if (!list.length) {
          $('#msTimeline').html('<div class="text-center text-muted py-3">暂无里程碑，点击右上角"新建里程碑"创建</div>');
          return;
        }
        $('#msTimeline').html(list.map(msItemHtml).join(''));
      }

      function msItemHtml(m) {
        const st = m.status || 'planned';
        const lv = m.ownerType === 'program' ? '群直属' : (m.ownerName || ('项目 #' + m.ownerId));
        const btns = [];
        if (st === 'planned' || st === 'delayed') {
          btns.push('<button class="btn btn-sm btn-outline-success ms-achieve" data-id="' + m.id + '" data-title="' + escapeAttr(m.title || '') + '">达成确认</button>');
        }
        if (st === 'planned') {
          btns.push('<button class="btn btn-sm btn-outline-warning ms-delay" data-id="' + m.id + '" data-title="' + escapeAttr(m.title || '') + '">标记延迟</button>');
        }
        if (st === 'achieved') {
          btns.push('<button class="btn btn-sm btn-outline-secondary ms-revert" data-id="' + m.id + '" data-title="' + escapeAttr(m.title || '') + '">撤销达成</button>');
        }
        btns.push('<button class="btn btn-sm btn-outline-primary ms-edit" data-id="' + m.id + '" data-ownname="' + escapeAttr(m.ownerName || '') + '">编辑</button>');
        btns.push('<button class="btn btn-sm btn-outline-danger ms-del" data-id="' + m.id + '">删除</button>');
        return '<div class="ms-item">'
          + '<span class="ms-dot st-' + st + '" title="' + (MS_TEXT[st] || st) + '"></span>'
          + '<div class="ms-body">'
          + '<div class="ms-title">' + escapeHtml(m.title || '-')
          + '<span class="ms-lv">' + escapeHtml(lv) + '</span>'
          + '<span class="status-badge ' + (MS_CLASS[st] || 'msb-planned') + '" style="margin-left:6px;">' + (MS_TEXT[st] || st) + '</span>'
          + (m.overdue ? '<span class="ms-overdue" title="目标日期已过且仍为规划中，仅黄标提示">已逾期</span>' : '')
          + '</div>'
          + '<div class="ms-meta">'
          + (m.milestoneCode ? escapeHtml(m.milestoneCode) + ' · ' : '')
          + '目标 ' + escapeHtml(m.targetDate || '-')
          + (m.achievedDate ? ' · 达成于 ' + escapeHtml(m.achievedDate) : '')
          + (m.owner ? ' · 负责人 ' + escapeHtml(m.owner) : '')
          + '</div>'
          + '<div>' + btns.join(' ') + '</div>'
          + '</div></div>';
      }

      // ---- 状态流转：达成确认（默认今天可改日期）/ 撤销 / 标记延迟 ----
      $('#msTimeline').on('click', '.ms-achieve', function () {
        const mid = $(this).data('id');
        const title = $(this).data('title') || '';
        const input = prompt('确认达成里程碑「' + title + '」\n达成日期（yyyy-MM-dd，默认今天）：', todayStr());
        if (input === null) return;
        const d = (input || '').trim() || todayStr();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { alert('日期格式应为 yyyy-MM-dd'); return; }
        API.bizPost('/api/v1/milestones/' + mid + '/transit', { target: 'achieved', achievedDate: d }).done(function (resp) {
          if (okResp(resp)) loadMilestones();
          else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(rmsg(resp, '流转失败')); }
        }).fail(function (xhr) { alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '流转失败'); });
      });
      $('#msTimeline').on('click', '.ms-delay', function () {
        const mid = $(this).data('id');
        if (!confirm('确认将里程碑标记为「已延迟」？')) return;
        API.bizPost('/api/v1/milestones/' + mid + '/transit', { target: 'delayed' }).done(function (resp) {
          if (okResp(resp)) loadMilestones();
          else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(rmsg(resp, '流转失败')); }
        }).fail(function (xhr) { alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '流转失败'); });
      });
      $('#msTimeline').on('click', '.ms-revert', function () {
        const mid = $(this).data('id');
        if (!confirm('确认撤销达成（回 planned，达成日期将清空）？')) return;
        API.bizPost('/api/v1/milestones/' + mid + '/transit', { target: 'planned' }).done(function (resp) {
          if (okResp(resp)) loadMilestones();
          else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(rmsg(resp, '流转失败')); }
        }).fail(function (xhr) { alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '流转失败'); });
      });
      $('#msTimeline').on('click', '.ms-del', function () {
        const mid = $(this).data('id');
        if (!confirm('确认删除里程碑 #' + mid + '？')) return;
        API.bizDelete('/api/v1/milestones/' + mid).done(function (resp) {
          if (okResp(resp)) loadMilestones();
          else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(rmsg(resp, '删除失败')); }
        }).fail(function (xhr) { alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '删除失败'); });
      });

      // ---- 新建（归属自动带入本群）/ 编辑 ----
      $('#msNewBtn').on('click', function () {
        fillMsModal({ ownerType: 'program', ownerId: parseInt(id, 10) }, '');
        $('#msModalTitle').text('新建里程碑（本群）');
        new bootstrap.Modal('#msModal').show();
      });
      $('#msTimeline').on('click', '.ms-edit', function () {
        const mid = $(this).data('id');
        const ownname = $(this).data('ownname') || '';
        API.bizGet('/api/v1/milestones/' + mid).done(function (resp) {
          if (!okResp(resp)) { alert(rmsg(resp, '加载失败')); return; }
          fillMsModal(resp.data || {}, ownname);
          $('#msModalTitle').text('编辑里程碑 #' + mid);
          new bootstrap.Modal('#msModal').show();
        }).fail(function (xhr) { alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '加载失败'); });
      });

      function fillMsModal(m, ownname) {
        $('#msFId').val(m.id || '');
        const ot = m.ownerType || 'program';
        const oid = m.ownerId != null ? m.ownerId : parseInt(id, 10);
        $('#msFOwnerType').val(ot);
        $('#msFOwnerId').val(oid);
        $('#msFOwnerDisplay').val(ot === 'program'
          ? ('项目群（本群）：' + programName)
          : ('项目：' + (ownname || ('#' + oid))));
        $('#msFTitle').val(m.title || '');
        $('#msFTarget').val(m.targetDate || '');
        $('#msFOwner').val(m.owner || '');
        $('#msFBlocker').val(m.blocker || '');
        $('#msFDesc').val(m.description || '');
        // 群级里程碑：成员项目多选（仅展示）
        if (ot === 'program') {
          $('#msSubRow').removeClass('d-none');
          const subs = m.subprojects || [];
          const subMap = {};
          subs.forEach(function (s) { subMap[typeof s === 'object' ? (s.id != null ? s.id : s.projectId) : s] = true; });
          if (!memberProjects.length) {
            $('#msSubList').html('<div class="text-muted py-1">（本群暂无成员项目）</div>');
          } else {
            $('#msSubList').html(memberProjects.map(function (p) {
              return '<div class="form-check"><input class="form-check-input ms-sub-ck" type="checkbox" value="' + p.id + '" id="mss-' + p.id + '"' + (subMap[p.id] ? ' checked' : '') + '>'
                + '<label class="form-check-label" for="mss-' + p.id + '" style="font-size:13px;">' + escapeHtml('#' + p.id + ' ' + (p.name || '')) + '</label></div>';
            }).join(''));
          }
        } else {
          $('#msSubRow').addClass('d-none');
        }
      }

      $('#msSaveBtn').on('click', function () {
        const mid = $('#msFId').val();
        const ot = $('#msFOwnerType').val();
        const body = {
          ownerType: ot,
          ownerId: parseInt($('#msFOwnerId').val(), 10),
          title: $('#msFTitle').val().trim(),
          description: $('#msFDesc').val().trim() || null,
          targetDate: $('#msFTarget').val() || null,
          owner: $('#msFOwner').val().trim() || null,
          blocker: $('#msFBlocker').val().trim() || null,
          subprojects: ot === 'program' ? collectMsSubprojects() : null
        };
        if (!body.title) { alert('标题不能为空'); return; }
        const $btn = $(this).prop('disabled', true);
        const req = mid ? API.bizPut('/api/v1/milestones/' + mid, body) : API.bizPost('/api/v1/milestones', body);
        req.done(function (resp) {
          if (okResp(resp)) {
            bootstrap.Modal.getInstance(document.getElementById('msModal')).hide();
            loadMilestones();
          } else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(rmsg(resp, '保存失败')); }
        }).fail(function (xhr) { alert((xhr.responseJSON && (xhr.responseJSON.msg || xhr.responseJSON.message)) || '保存失败'); })
          .always(function () { $btn.prop('disabled', false); });
      });
      function collectMsSubprojects() {
        const arr = [];
        $('#msSubList .ms-sub-ck:checked').each(function () { arr.push(parseInt($(this).val(), 10)); });
        return arr;
      }

      function todayStr() {
        const d = new Date();
        const p = function (n) { return n < 10 ? '0' + n : n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
      }

      function goPage(key, title, page) {
        if (window.self !== window.top && window.parent && window.parent.eaiselpNav) {
          window.parent.eaiselpNav(key, title, page);
        } else {
          location.href = page.replace(/^pages\//, '');
        }
      }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function fmtTime(t) {
        if (!t) return '-';
        const d = new Date(typeof t === 'string' ? t.replace('T', ' ') : t);
        if (isNaN(d.getTime())) return String(t);
        const p = function (n) { return n < 10 ? '0' + n : n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
          + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }

      load();
    });
  </script>
</body>
</html>
