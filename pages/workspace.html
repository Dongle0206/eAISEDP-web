<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作区文件 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body { background:#f0f2f5; }
    .page-wrap { display:flex; height:100vh; overflow:hidden; }
    .left-panel { width:300px; background:#fff; border-right:1px solid #e8e8e8; overflow-y:auto; flex-shrink:0; }
    .left-panel .header { padding:16px 20px; border-bottom:1px solid #e8e8e8; }
    .file-item { padding:8px 20px; cursor:pointer; border-bottom:1px solid #f5f5f5; font-size:13px; }
    .file-item:hover { background:#f5f7fa; }
    .file-item.active { background:#e6f4ff; border-left:3px solid #1677ff; }
    .file-icon { margin-right:6px; }
    .right-panel { flex:1; overflow-y:auto; padding:24px; }
    pre { background:#1e1e1e; color:#d4d4d4; padding:16px; border-radius:6px; font-size:13px; overflow:auto; }
    .empty-state { text-align:center; padding:80px 20px; color:#999; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="left-panel">
      <div class="header">
        <h6 style="margin:0;color:#1677ff;">📂 工作区文件</h6>
        <select id="caseFilter" class="form-select form-select-sm mt-2"><option value="">选择 Case...</option></select>
      </div>
      <div id="fileList"><div class="empty-state" style="padding:40px;font-size:13px;">选择 Case 后加载</div></div>
    </div>
    <div class="right-panel">
      <div id="fileToolbar" class="mb-2 d-flex gap-2 align-items-center">
        <button id="validateBtn" class="btn btn-outline-primary btn-sm">🔍 验证代码</button>
        <button id="previewBtn" class="btn btn-outline-success btn-sm d-none">👁 预览网页</button>
        <span id="validateResult" class="small"></span>
      </div>
      <div id="fileContent"><div class="empty-state"><div style="font-size:40px;">📄</div><div>选择左侧文件查看内容</div></div></div>
    </div>
  </div>
  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(function(){const API=window.EAISELP_API,CFG=window.EAISELP_CONFIG;if(!API.getToken()){location.href='../'+CFG.LOGIN_PAGE;return;}
    function loadCases(){API.bizGet('/api/v1/cases?page=1&size=50').done(function(r){if(r.code!==0)return;var l=(r.data&&(r.data.records||r.data.list)||[]);var $s=$('#caseFilter').empty().append('<option value="">选择 Case...</option>');l.forEach(function(c){$s.append('<option value="'+esc(c.caseId)+'">'+esc(c.caseId)+' | '+esc(c.title||'')+'</option>');});});}
    function loadFiles(cid){$('#fileList').html('<div class="empty-state" style="padding:40px;"><div class="spinner-border text-primary"></div></div>');
    $.ajax({url:CFG.API_BASE_URL+'/api/runtime/workspace/'+encodeURIComponent(cid)+'/files',method:'GET',headers:{'Authorization':'Bearer '+API.getToken()},dataType:'json'}).done(function(r){
    if(r.code===0&&r.data&&r.data.exists){var f=r.data.files||[];if(!f.length){$('#fileList').html('<div class="empty-state" style="padding:40px;font-size:13px;">该 Case 无产出文件<br><br>请先执行一键编排</div>');return;}
    $('#fileList').html(f.map(function(p,i){var ic='📄';if(p.endsWith('.html'))ic='🌐';else if(p.endsWith('.js'))ic='⚙';else if(p.endsWith('.css'))ic='🎨';else if(p.endsWith('.md'))ic='📝';else if(p.endsWith('.java'))ic='☕';else if(p.endsWith('.py'))ic='🐍';else if(p.endsWith('.sh'))ic='🔧';else if(p.endsWith('.sql'))ic='🗄';else if(p==='Dockerfile')ic='🐳';
    return '<div class="file-item'+(i===0?' active':'')+'" data-path="'+esc(p)+'"><span class="file-icon">'+ic+'</span>'+esc(p)+'</div>';}).join(''));
    if(f.length)readFile(cid,f[0]);}else{$('#fileList').html('<div class="empty-state" style="padding:40px;font-size:13px;">工作区不存在<br><br>请先执行一键编排</div>');}}).fail(function(){$('#fileList').html('<div class="empty-state" style="padding:40px;font-size:13px;color:#ff4d4f;">加载失败</div>');});}
    function readFile(cid,path){$('.file-item').removeClass('active');$('.file-item[data-path="'+path.replace(/"/g,'&quot;')+'"]').addClass('active');
    if(/\.html?$/i.test(path)){$('#previewBtn').removeClass('d-none').data('path',path);}else{$('#previewBtn').addClass('d-none');}
    $.ajax({url:CFG.API_BASE_URL+'/api/runtime/workspace/'+encodeURIComponent(cid)+'/read?path='+encodeURIComponent(path),method:'GET',headers:{'Authorization':'Bearer '+API.getToken()},dataType:'json'}).done(function(r){if(r.code===0){var c=r.data||'';var isCode=/\.(html|js|css|java|py|sql|sh|json|xml|yaml|yml)$/.test(path)||path==='Dockerfile';
    $('#fileContent').html('<h6 style="margin-bottom:16px;color:#333;">'+esc(path)+'</h6>'+(isCode?'<pre>'+esc(c)+'</pre>':'<div style="background:#fff;padding:24px;border-radius:6px;line-height:1.8;white-space:pre-wrap;">'+esc(c)+'</div>'));}else{$('#fileContent').html('<div class="empty-state" style="color:#ff4d4f;">'+esc(r.msg||'读取失败')+'</div>');}});}
    $('#validateBtn').on('click',function(){var cid=$('#caseFilter').val();if(!cid){alert('请先选择 Case');return;}
    var $b=$(this).prop('disabled',true).text('验证中...');$('#validateResult').html('');
    API.bizPost('/api/runtime/workspace/'+encodeURIComponent(cid)+'/validate',{}).done(function(r){
    $b.prop('disabled',false).text('🔍 验证代码');
    if(r.code===0&&r.data){var v=r.data;
    var color=v.allPassed?'#52c41a':(v.failedFiles>0?'#ff4d4f':'#999');
    var html='<span style="color:'+color+';font-weight:600;">'+(v.allPassed?'✅ 全部通过':'❌ '+v.failedFiles+' 个失败')+' ('+v.passedFiles+'/'+v.totalFiles+')</span>';
    if(v.failedFiles>0){html+='<div style="margin-top:8px;max-height:200px;overflow:auto;">';
    (v.checks||[]).forEach(function(c){if(!c.passed){html+='<div style="font-size:12px;color:#ff4d4f;margin-bottom:4px;">❌ <strong>'+esc(c.path)+'</strong> ('+esc(c.type||'')+'): '+esc(c.message||'')+'</div>';});html+='</div>';}
    $('#validateResult').html(html);}else{$('#validateResult').html('<span class="text-danger">'+esc(r.msg||'验证失败')+'</span>');}}).fail(function(){$b.prop('disabled',false).text('🔍 验证代码');$('#validateResult').html('<span class="text-danger">请求失败</span>');});});
    $('#previewBtn').on('click',function(){var cid=$('#caseFilter').val();var path=$(this).data('path');if(!cid||!path)return;
    var url=CFG.API_BASE_URL+'/api/runtime/workspace/'+encodeURIComponent(cid)+'/preview?path='+encodeURIComponent(path);
    $('#fileContent').html('<h6 style="margin-bottom:16px;color:#333;">👁 预览: '+esc(path)+'</h6><div style="background:#fff;border:1px solid #e8e8e8;border-radius:6px;overflow:hidden;"><div style="background:#f5f5f5;padding:8px 12px;font-size:12px;color:#999;border-bottom:1px solid #e8e8e8;">⚠ 沙箱预览：AI 生成的网页（相对路径资源可能不加载）</div><iframe src="'+url+'" style="width:100%;height:500px;border:none;"></iframe></div>');});
    $('#caseFilter').on('change',function(){var v=$(this).val();if(v)loadFiles(v);else $('#fileList').html('<div class="empty-state" style="padding:40px;font-size:13px;">选择 Case 后加载</div>');});
    $('#fileList').on('click','.file-item',function(){var cid=$('#caseFilter').val();if(cid)readFile(cid,$(this).data('path'));});
    function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    loadCases();});
  </script>
</body>
</html>
