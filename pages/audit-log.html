<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计日志 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body { background:#f0f2f5; }
    .page-wrap { padding:20px; }
    .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar .spacer { flex:1; }
    .section { background:#fff; border-radius:6px; padding:16px 20px; margin-bottom:16px; }
    .section h6 { color:#1677ff; border-left:3px solid #1677ff; padding-left:8px; margin-bottom:14px; }
    .result-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
    .result-success { background:#f6ffed; color:#52c41a; }
    .result-failure { background:#fff1f0; color:#ff4d4f; }
    .result-unknown { background:#f5f5f5; color:#999; }
    .action-tag { background:#e6f4ff; color:#1677ff; padding:2px 8px; border-radius:10px; font-size:12px; }
    .detail-toggle { color:#1677ff; cursor:pointer; font-size:12px; }
    .detail-toggle:hover { text-decoration:underline; }
    .detail-content { background:#fafafa; border:1px solid #f0f0f0; border-radius:4px; padding:8px 10px;
      font-size:12px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all; margin-top:6px; }
    .pager { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:16px; }
    .empty-row td { text-align:center; color:#999; padding:40px 0; }
    .meta-cell { color:#999; font-size:12px; }
  </style>
</head>
<body>
  <div class="page-wrap">

    <!-- 工具栏 -->
    <div class="toolbar">
      <h5 class="mb-0">审计日志</h5>
      <div class="spacer"></div>
      <label class="mb-0 d-flex align-items-center" style="gap:6px;">
        <span class="text-muted">操作类型：</span>
        <select id="actionFilter" class="form-select form-select-sm" style="width:auto;">
          <option value="">全部</option>
          <option value="login_success">登录成功</option>
          <option value="login_failure">登录失败</option>
          <option value="logout">退出</option>
          <option value="case_create">创建 Case</option>
          <option value="case_transit">Case 状态变更</option>
          <option value="derivation">派生</option>
          <option value="checkpoint">检查点审批</option>
          <option value="user">用户操作</option>
        </select>
      </label>
      <input id="userFilter" type="number" class="form-control form-control-sm" style="width:120px;" placeholder="用户ID筛选">
      <button id="refreshBtn" class="btn btn-primary btn-sm">查询</button>
    </div>

    <!-- 表格 -->
    <div class="section">
      <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:170px;">时间</th>
              <th style="width:110px;">用户</th>
              <th style="width:130px;">操作类型</th>
              <th style="width:100px;">资源类型</th>
              <th>资源ID</th>
              <th style="width:80px;">结果</th>
              <th style="width:110px;">IP</th>
              <th style="width:70px;">详情</th>
            </tr>
          </thead>
          <tbody id="logTbody">
            <tr class="empty-row"><td colspan="8">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pager">
        <span id="pageInfo" class="text-muted me-2" style="font-size:13px;"></span>
        <button id="prevBtn" class="btn btn-outline-secondary btn-sm">上一页</button>
        <span id="pageNumbers" style="font-size:13px;"></span>
        <button id="nextBtn" class="btn btn-outline-secondary btn-sm">下一页</button>
        <select id="sizeSelect" class="form-select form-select-sm" style="width:auto;">
          <option value="20">20/页</option>
          <option value="50">50/页</option>
          <option value="100">100/页</option>
        </select>
      </div>
    </div>

  </div>

  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(function () {
      const API = window.EAISELP_API;
      const CFG = window.EAISELP_CONFIG;
      if (!API.getToken()) { location.href = '../' + CFG.LOGIN_PAGE; return; }

      const state = { page: 1, size: 20, action: '', total: 0 };

      // 操作类型中文映射（后端 action 英文，前端展示中文）
      const ACTION_TEXT = {
        login_success: '登录成功', login_failure: '登录失败', logout: '退出',
        case_create: '创建 Case', case_transit: 'Case 状态变更',
        derivation: '派生', checkpoint: '检查点审批',
        user_create: '创建用户', user_update: '修改用户', user_delete: '删除用户',
        role_grant: '授权角色', role_revoke: '撤销角色'
      };

      // GET /api/v1/audit-logs?page=&size=&action= 或按用户 /users/{userId}
      function loadList() {
        const userId = $('#userFilter').val().trim();
        if (userId) {
          // 按用户查询（#14：用户操作时间线）
          $('#logTbody').html('<tr class="empty-row"><td colspan="8">加载中...</td></tr>');
          API.bizGet('/api/v1/audit-logs/users/' + encodeURIComponent(userId) + '?limit=' + state.size).done(function (resp) {
            if (resp.code !== 0) { renderError(resp.msg || '加载失败'); return; }
            const list = resp.data || [];
            state.total = list.length;
            renderTable(list);
            $('#pageInfo').text('用户 ' + userId + ' 最近 ' + list.length + ' 条');
            $('#pageNumbers').html('');
            $('#prevBtn,#nextBtn').prop('disabled', true);
          }).fail(function (xhr) { renderError('请求失败(' + xhr.status + ')'); });
          return;
        }
        const params = new URLSearchParams();
        params.set('page', state.page);
        params.set('size', state.size);
        if (state.action) params.set('action', state.action);
        $('#logTbody').html('<tr class="empty-row"><td colspan="8">加载中...</td></tr>');
        API.bizGet('/api/v1/audit-logs?' + params.toString()).done(function (resp) {
          if (resp.code !== 0) { renderError(resp.msg || '加载失败'); return; }
          const data = resp.data || {};
          // IPage 结构: records / total / current / size
          const list = data.records || data.list || data.items || [];
          state.total = data.total != null ? data.total : list.length;
          renderTable(list);
          renderPager();
        }).fail(function (xhr) {
          if (xhr.status === 403) {
            renderError('无审计日志读取权限（需 audit:read 权限）');
          } else {
            renderError((xhr.responseJSON && xhr.responseJSON.msg) || ('请求失败（' + xhr.status + '）'));
          }
        });
      }

      function renderError(msg) {
        $('#logTbody').html('<tr class="empty-row"><td colspan="8">' + escapeHtml(msg) + '</td></tr>');
        $('#pageInfo').text('');
        $('#pageNumbers').html('');
      }

      function renderTable(list) {
        if (!list.length) {
          $('#logTbody').html('<tr class="empty-row"><td colspan="8">暂无审计日志记录</td></tr>');
          return;
        }
        const rows = list.map(function (log) {
          const id = log.id || '';
          const time = fmtTime(log.createTime || log.createdAt);
          const username = log.username || (log.userId != null ? '用户' + log.userId : '系统');
          const action = log.action || '-';
          const actionTxt = ACTION_TEXT[action] || action;
          const resType = log.resourceType || '-';
          const resId = log.resourceId || '-';
          const result = log.result || 'unknown';
          const resultCls = result === 'success' ? 'result-success' : result === 'failure' ? 'result-failure' : 'result-unknown';
          const resultTxt = result === 'success' ? '成功' : result === 'failure' ? '失败' : result;
          const ip = log.ipAddress || '-';
          const hasDetail = !!log.detail;
          const hasError = !!log.errorMsg;

          return '<tr>'
            + '<td class="meta-cell">' + escapeHtml(time) + '</td>'
            + '<td>' + escapeHtml(username) + '</td>'
            + '<td><span class="action-tag">' + escapeHtml(actionTxt) + '</span></td>'
            + '<td>' + escapeHtml(resType) + '</td>'
            + '<td class="meta-cell">' + escapeHtml(resId) + '</td>'
            + '<td><span class="result-badge ' + resultCls + '">' + resultTxt + '</span></td>'
            + '<td class="meta-cell">' + escapeHtml(ip) + '</td>'
            + '<td>' + (hasDetail || hasError
                ? '<span class="detail-toggle" data-id="' + escapeHtml(id) + '">展开</span>' : '-')
            + '</td>'
            + '</tr>'
            // 详情行（默认隐藏，点击展开）
            + '<tr class="detail-row d-none" data-detail-for="' + escapeHtml(id) + '">'
            + '<td colspan="8">'
            + (hasError ? '<div class="detail-content text-danger">错误：' + escapeHtml(log.errorMsg) + '</div>' : '')
            + (hasDetail ? '<div class="detail-content">' + escapeHtml(formatJson(log.detail)) + '</div>' : '')
            + '</td></tr>';
        });
        $('#logTbody').html(rows.join(''));
      }

      function renderPager() {
        const totalPages = Math.max(1, Math.ceil(state.total / state.size));
        const cur = state.page;
        $('#pageInfo').text('共 ' + state.total + ' 条，第 ' + cur + '/' + totalPages + ' 页');
        $('#prevBtn').prop('disabled', cur <= 1);
        $('#nextBtn').prop('disabled', cur >= totalPages);
      }

      // 格式化 JSON 字符串（美化展示）
      function formatJson(str) {
        if (!str) return '';
        try {
          return JSON.stringify(JSON.parse(str), null, 2);
        } catch (e) {
          return str; // 非 JSON 原样返回
        }
      }

      // XSS 防护
      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function fmtTime(t) {
        if (!t) return '-';
        const d = typeof t === 'number' ? new Date(t) : new Date(t);
        if (isNaN(d.getTime())) return String(t);
        const p = function (n) { return n < 10 ? '0' + n : n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
          + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }

      // 事件绑定
      $('#actionFilter').on('change', function () { state.action = $(this).val(); state.page = 1; });
      $('#sizeSelect').on('change', function () { state.size = parseInt($(this).val(), 10); state.page = 1; loadList(); });
      $('#refreshBtn').on('click', function () { state.page = 1; loadList(); });
      $('#prevBtn').on('click', function () { if (state.page > 1) { state.page--; loadList(); } });
      $('#nextBtn').on('click', function () {
        const totalPages = Math.max(1, Math.ceil(state.total / state.size));
        if (state.page < totalPages) { state.page++; loadList(); }
      });

      // 详情展开/收起（事件委托）
      $('#logTbody').on('click', '.detail-toggle', function () {
        const id = $(this).data('id');
        const $row = $('.detail-row[data-detail-for="' + id + '"]');
        if ($row.hasClass('d-none')) {
          $row.removeClass('d-none');
          $(this).text('收起');
        } else {
          $row.addClass('d-none');
          $(this).text('展开');
        }
      });

      // 首次加载
      loadList();
    });
  </script>
</body>
</html>
