<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计日志 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    /* 本页局部样式（颜色沿用平台主色 #1677ff） */
    body { background:#f0f2f5; }
    .page-wrap { padding:20px; }
    .section { background:#fff; border-radius:6px; padding:24px; }
    .section h6 { color:#1677ff; border-left:3px solid #1677ff; padding-left:8px; margin-bottom:14px; }
    .building-card { text-align:center; padding:50px 20px; }
    .building-icon { width:72px; height:72px; margin:0 auto 16px; border-radius:50%;
      background:#e6f4ff; color:#1677ff; font-size:34px; display:flex; align-items:center; justify-content:center; }
    .building-title { font-size:18px; font-weight:600; color:#333; margin-bottom:8px; }
    .building-desc { color:#666; font-size:14px; max-width:520px; margin:0 auto 8px; line-height:1.7; }
    .building-tech { color:#999; font-size:12px; margin-top:16px; }
    .badge-tech { background:#f5f5f5; color:#666; padding:2px 8px; border-radius:10px; margin:0 4px; font-size:12px; }
    .info-list { max-width:560px; margin:24px auto 0; }
    .info-list li { color:#666; font-size:13px; line-height:2; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="section">
      <h6>审计日志</h6>
      <div class="building-card">
        <div class="building-icon">📋</div>
        <div class="building-title">审计日志查看功能建设中</div>
        <div class="building-desc">
          审计数据已通过治理层落库到 <code>t_governance_log</code>，包含 Case 派生、检查点审批、产物操作、用户与权限变更等关键行为记录。
          查询 API 计划在 M3-2 后续迭代暴露，届时本页将提供按时间 / 用户 / 操作类型 / Case 的多维检索与导出。
        </div>
        <ul class="info-list list-unstyled">
          <li>· 数据存储：<code>t_governance_log</code>（治理日志表，已启用写入）</li>
          <li>· 当前状态：写入链路已通，查询 API 待开发</li>
          <li>· 预计能力：时间范围筛选、操作类型筛选、用户追溯、Case 关联、CSV 导出</li>
        </ul>
        <div class="building-tech">
          <span class="badge-tech">M3-2</span>
          <span class="badge-tech">t_governance_log</span>
          <span class="badge-tech">API 待暴露</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(function () {
      const API = window.EAISELP_API;
      const CFG = window.EAISELP_CONFIG;
      // 路由保护：iframe 内访问未登录跳登录页
      if (!API.getToken()) { location.href = '../' + CFG.LOGIN_PAGE; return; }
      // 占位页：后端查询 API 未暴露，无需调接口
    });
  </script>
</body>
</html>
