<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产物查看 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body { background:#f0f2f5; }
    .page-wrap { display:flex; height:100vh; overflow:hidden; }
    .left-panel { width:320px; background:#fff; border-right:1px solid #e8e8e8; overflow-y:auto; flex-shrink:0; }
    .left-panel .header { padding:16px 20px; border-bottom:1px solid #e8e8e8; }
    .left-panel .header h6 { margin:0; color:#1677ff; font-size:15px; }
    .artifact-item { padding:14px 20px; border-bottom:1px solid #f0f0f0; cursor:pointer; transition:background .15s; }
    .artifact-item:hover { background:#f5f7fa; }
    .artifact-item.active { background:#e6f4ff; border-left:3px solid #1677ff; }
    .artifact-role { font-size:12px; color:#1677ff; font-weight:600; }
    .artifact-type { display:inline-block; background:#f5f5f5; padding:1px 6px; border-radius:8px; font-size:11px; color:#666; margin-left:6px; }
    .artifact-title { font-size:13px; color:#333; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .artifact-meta { font-size:11px; color:#999; margin-top:2px; }
    .right-panel { flex:1; overflow-y:auto; padding:24px 32px; }
    .right-panel .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .markdown-body { background:#fff; border-radius:8px; padding:24px 32px; max-width:900px; line-height:1.8; }
    .markdown-body h1,.markdown-body h2,.markdown-body h3 { color:#1677ff; margin-top:24px; }
    .markdown-body pre { background:#f5f5f5; padding:12px; border-radius:4px; overflow:auto; }
    .markdown-body code { background:#f0f0f0; padding:1px 4px; border-radius:3px; font-size:13px; }
    .markdown-body pre code { background:none; padding:0; }
    .markdown-body table { border-collapse:collapse; width:100%; }
    .markdown-body th,.markdown-body td { border:1px solid #e8e8e8; padding:8px; }
    .empty-state { text-align:center; padding:80px 20px; color:#999; }
    .token-badge { background:#f9f0ff; color:#722ed1; padding:1px 6px; border-radius:8px; font-size:11px; margin-left:4px; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- 左侧：产物列表 -->
    <div class="left-panel">
      <div class="header">
        <h6>📋 产物列表</h6>
        <div style="margin-top:8px;">
          <select id="caseFilter" class="form-select form-select-sm">
            <option value="">选择 Case...</option>
          </select>
        </div>
      </div>
      <div id="artifactList">
        <div class="empty-state" style="padding:40px 20px;">
          <div style="font-size:13px;">选择 Case 后加载产物</div>
        </div>
      </div>
    </div>

    <!-- 右侧：产物详情 -->
    <div class="right-panel">
      <div id="detailContent">
        <div class="empty-state">
          <div style="font-size:40px; margin-bottom:16px;">📄</div>
          <div style="font-size:16px; margin-bottom:8px;">产物查看</div>
          <div style="font-size:13px;">从左侧选择一个产物查看完整内容</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/lib/marked.min.js"></script>
  <script>
    $(function () {
      const API = window.EAISELP_API;
      const CFG = window.EAISELP_CONFIG;
      if (!API.getToken()) { location.href = '../' + CFG.LOGIN_PAGE; return; }

      const ROLE_TEXT = {
        'team-po': '产品经理(PO)', 'team-ux': '体验设计(UX)', 'team-ba': '业务分析(BA)',
        'team-se': '系统工程(SE)', 'team-dev': '开发(Dev)', 'team-reviewer': '代码审查(Reviewer)',
        'team-qa': '测试(QA)', 'team-ops': '运维(Ops)', 'team-pm': '项目经理(PM)',
        'team-security': '安全(Security)', 'team-performance': '性能(Performance)',
        'team-dba': '数据库(DBA)', 'team-sre': '可靠性(SRE)', 'team-analyst': '产品分析(Analyst)'
      };
      const TYPE_TEXT = {
        'prd': '需求文档', 'design': '设计', 'tech-design': '技术方案', 'tasks': '任务清单',
        'code': '代码', 'review': '审查报告', 'test': '测试', 'perf': '性能',
        'deploy': '部署', 'tracking': '跟踪', 'other': '其他', 'unknown': '未知'
      };

      // 加载 Case 列表
      function loadCases() {
        API.bizGet('/api/v1/cases?page=1&size=50').done(function (resp) {
          if (resp.code !== 0) return;
          const list = (resp.data && (resp.data.records || resp.data.list || [])) || [];
          const $sel = $('#caseFilter').empty().append('<option value="">选择 Case...</option>');
          list.forEach(function (c) {
            $sel.append('<option value="' + escapeAttr(c.caseId) + '">' +
              escapeHtml(c.caseId) + ' | ' + escapeHtml(c.title || '无标题') + ' | ' + escapeHtml(c.status || '') +
              '</option>');
          });
        });
      }

      // 加载某个 Case 的所有派生产出
      function loadArtifacts(caseId) {
        $('#artifactList').html('<div class="empty-state" style="padding:40px;"><div class="spinner-border text-primary"></div></div>');

        // 调用派生列表 API（含 output 全文）
        API.bizGet('/api/v1/cases/' + encodeURIComponent(caseId) + '/derivations').done(function (resp) {
          if (resp.code !== 0) {
            $('#artifactList').html('<div class="empty-state" style="padding:40px;color:#ff4d4f;">' + escapeHtml(resp.msg || '加载失败') + '</div>');
            return;
          }
          const data = resp.data || {};
          const list = data.records || data.list || data.items || (Array.isArray(data) ? data : []);

          if (!list.length) {
            $('#artifactList').html('<div class="empty-state" style="padding:40px;"><div style="font-size:13px;">该 Case 暂无派生产出</div></div>');
            return;
          }

          const html = list.map(function (d, i) {
            const role = d.role || d.roleCode || '-';
            const roleText = ROLE_TEXT[role] || role;
            const status = d.status || 'unknown';
            const statusColor = status === 'success' ? '#52c41a' : status === 'failed' ? '#ff4d4f' : '#1677ff';
            const model = d.model || '';
            const inTok = d.inputTokens != null ? d.inputTokens : '';
            const outTok = d.outputTokens != null ? d.outputTokens : '';
            const hasOutput = !!(d.output || d.summary || d.result);

            return '<div class="artifact-item' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">'
              + '<div>'
              + '<span class="artifact-role">' + escapeHtml(roleText) + '</span>'
              + '<span class="artifact-type">' + escapeHtml(TYPE_TEXT[d.type] || status) + '</span>'
              + '<span style="float:right;font-size:11px;color:' + statusColor + ';">' + status + '</span>'
              + '</div>'
              + (model ? '<div class="artifact-meta">模型: ' + escapeHtml(model) + '</div>' : '')
              + (inTok !== '' ? '<div class="artifact-meta">Token: in ' + escapeHtml(inTok) + ' / out ' + escapeHtml(outTok) + '</div>' : '')
              + '<div class="artifact-meta">' + escapeHtml(fmtTime(d.createdAt || d.createTime)) + '</div>'
              + '</div>';
          }).join('');

          $('#artifactList').html(html);

          // 存储数据供点击查看
          window._artifacts = list;

          // 默认显示第一个
          if (list.length) showDetail(0);

        }).fail(function (xhr) {
          $('#artifactList').html('<div class="empty-state" style="padding:40px;color:#ff4d4f;">请求失败(' + xhr.status + ')</div>');
        });
      }

      // 显示产物详情
      function showDetail(idx) {
        const d = (window._artifacts || [])[idx];
        if (!d) return;

        $('.artifact-item').removeClass('active');
        $('.artifact-item[data-idx="' + idx + '"]').addClass('active');

        const role = d.role || '-';
        const roleText = ROLE_TEXT[role] || role;
        const content = d.output || d.summary || d.result || '';
        const model = d.model || '';
        const inTok = d.inputTokens != null ? d.inputTokens : '-';
        const outTok = d.outputTokens != null ? d.outputTokens : '-';
        const task = d.task || d.taskDesc || '';

        let html = '<div class="toolbar">';
        html += '<h5 style="margin:0;">' + escapeHtml(roleText) + ' 产出</h5>';
        html += '<span class="badge bg-secondary">' + escapeHtml(TYPE_TEXT[d.type] || d.status || '-') + '</span>';
        if (model) html += '<span class="badge bg-info">' + escapeHtml(model) + '</span>';
        html += '<span class="token-badge">in: ' + inTok + ' / out: ' + outTok + '</span>';
        html += '</div>';

        if (task) {
          html += '<div style="background:#fffbeb;border:1px solid #fef3c7;border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#92400e;">';
          html += '<strong>派生任务：</strong>' + escapeHtml(task);
          html += '</div>';
        }

        html += '<div class="markdown-body">';
        if (content) {
          html += renderMarkdown(content);
        } else {
          html += '<div class="empty-state"><div>该派生无产出内容</div></div>';
        }
        html += '</div>';

        $('#detailContent').html(html);
      }

      // 事件
      $('#caseFilter').on('change', function () {
        const caseId = $(this).val();
        if (caseId) loadArtifacts(caseId);
        else $('#artifactList').html('<div class="empty-state" style="padding:40px;"><div style="font-size:13px;">选择 Case 后加载产物</div></div>');
      });

      $('#artifactList').on('click', '.artifact-item', function () {
        showDetail(parseInt($(this).data('idx'), 10));
      });

      // 工具函数
      function renderMarkdown(md) {
        try {
          if (window.marked && typeof window.marked.parse === 'function') return window.marked.parse(String(md));
        } catch (e) {}
        return '<pre style="white-space:pre-wrap;background:transparent;border:none;padding:0;">' + escapeHtml(md) + '</pre>';
      }
      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function escapeAttr(s) {
        if (s == null) return '';
        return String(s).replace(/"/g, '&quot;');
      }
      function fmtTime(t) {
        if (!t) return '-';
        const d = typeof t === 'number' ? new Date(t) : new Date(t);
        if (isNaN(d.getTime())) return String(t);
        const p = function (n) { return n < 10 ? '0' + n : n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
          + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }

      // 初始化
      loadCases();
    });
  </script>
</body>
</html>
