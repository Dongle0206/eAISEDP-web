<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>body{background:#f0f2f5;}.page-wrap{padding:20px;}.section{background:#fff;border-radius:6px;padding:16px 20px;margin-bottom:16px;}</style>
</head>
<body>
  <div class="page-wrap">
    <div class="section"><h5 class="mb-0">角色管理</h5><p class="text-muted small mb-0">系统角色定义与权限分配。系统预置角色不可删除。</p></div>
    <div class="section"><div id="roleList"><div class="text-center text-muted py-4">加载中...</div></div></div>
    <div class="section"><h6>权限点清单</h6><div id="permList" class="row"></div></div>
  </div>
  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(function(){const API=window.EAISELP_API,CFG=window.EAISELP_CONFIG;if(!API.getToken()){location.href='../'+CFG.LOGIN_PAGE;return;}
    API.bizGet('/api/v1/roles').done(function(r){if(r.code!==0){$('#roleList').html('<div class="text-danger">加载失败</div>');return;}
    var l=r.data||[];if(!Array.isArray(l)){l=l.records||l.list||[];}
    if(!l.length){$('#roleList').html('<div class="text-center text-muted py-4">暂无角色</div>');return;}
    $('#roleList').html('<table class="table table-sm table-bordered"><thead><tr><th>角色码</th><th>角色名</th><th>类型</th><th>数据范围</th><th>预置</th><th>描述</th></tr></thead><tbody>'+
    l.map(function(ro){return '<tr><td><code>'+esc(ro.roleCode)+'</code></td><td>'+esc(ro.roleName)+'</td><td>'+esc(ro.roleType||'')+'</td><td>'+esc(ro.dataScope||'')+'</td><td>'+(ro.isBuiltIn!=null&&ro.isBuiltIn?='<span class="badge bg-secondary">预置</span>':'<span class="badge bg-info">自定义</span>')+'</td><td style="font-size:12px;">'+esc(ro.description||'-')+'</td></tr>';}).join('')+
    '</tbody></table>');}).fail(function(){$('#roleList').html('<div class="text-danger py-4">请求失败</div>');});
    API.bizGet('/api/v1/permissions').done(function(r){if(r.code!==0)return;var l=r.data||[];if(!Array.isArray(l)){l=l.records||l.list||[];}
    $('#permList').html(l.map(function(p){return '<div class="col-md-3 mb-1"><span class="badge bg-light text-dark border"><code>'+esc(p.code)+'</code> '+esc(p.description||'')+'</span></div>';}).join(''));});
    function esc(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    });
  </script>
</body>
</html>
