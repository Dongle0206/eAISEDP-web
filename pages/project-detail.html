<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情 - eAISEDP</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body { background:#f0f2f5; }
    .page-wrap { padding:20px; }
    .section { background:#fff; border-radius:6px; padding:16px 20px; margin-bottom:16px; }
    .section h6 { color:#1677ff; border-left:3px solid #1677ff; padding-left:8px; margin-bottom:14px; }
    .info-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 24px; font-size:14px; }
    .info-grid .label { color:#999; }
    .status-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
    .pr-planning { background:#f5f5f5; color:#999; }
    .pr-in_progress { background:#e6f4ff; color:#1677ff; }
    .pr-delivered { background:#f6ffed; color:#52c41a; }
    .pr-closed { background:#f0f0f0; color:#888; }
    .pr-unknown { background:#f5f5f5; color:#999; }
    .cs-drafting { background:#f5f5f5; color:#999; }
    .cs-deriving { background:#e6f4ff; color:#1677ff; }
    .cs-reviewing { background:#f9f0ff; color:#722ed1; }
    .cs-testing { background:#fff7e6; color:#faad14; }
    .cs-deploying { background:#e6fffb; color:#08979c; }
    .cs-done { background:#f6ffed; color:#52c41a; }
    .cs-unknown { background:#f5f5f5; color:#999; }
    .progress { height:10px; background:#eee; border-radius:5px; overflow:hidden; }
    .progress .bar { height:100%; background:#1677ff; border-radius:5px; }
    .principle-chip { display:inline-block; border:1px solid #d3adf7; background:#f9f0ff; color:#531dab; border-radius:8px; padding:4px 10px; font-size:13px; margin:0 6px 6px 0; }
    .principle-chip .lv { font-weight:700; margin-right:4px; }
    .principle-chip.off { border-color:#ddd; background:#f5f5f5; color:#999; }
    .empty-row td { text-align:center; color:#999; padding:32px 0; }
    .case-code { color:#1677ff; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div class="page-wrap">

    <div id="layerTip" class="alert alert-warning d-none" style="font-size:13px;"></div>

    <!-- 基本信息 -->
    <div class="section d-none" id="headSection">
      <div class="d-flex align-items-center flex-wrap" style="gap:10px;">
        <h5 class="mb-0" id="pName">项目详情</h5>
        <span id="pStatus"></span>
        <div class="ms-auto text-end">
          <div style="font-size:12px;color:#999;">进度（Case 完成 <span id="pDone">0</span>/<span id="pTotal">0</span>，自动汇总）</div>
          <div style="font-size:26px;font-weight:700;color:#1677ff;"><span id="pProg">0</span>%</div>
        </div>
      </div>
      <div class="progress mt-2"><div class="bar" id="pProgBar" style="width:0%;"></div></div>
      <div class="info-grid mt-3">
        <div><span class="label">编号：</span>#<span id="pId"></span></div>
        <div><span class="label">所属项目群：</span><span id="pProgram"></span></div>
        <div><span class="label">优先级：</span>P<span id="pPriority"></span></div>
        <div><span class="label">创建时间：</span><span id="pCreated"></span></div>
      </div>
      <div class="mt-2"><span class="label" style="color:#999;">描述 / 约束：</span><span id="pDesc" style="white-space:pre-wrap;"></span></div>
      <button class="btn btn-sm btn-outline-secondary mt-3" id="backBtn">← 返回项目列表</button>
    </div>

    <!-- 已绑定架构原则 -->
    <div class="section d-none" id="principleSection">
      <h6>已绑定架构原则（注入本项目 Case 编排上下文）</h6>
      <div id="principleBox"><span class="text-muted">加载中...</span></div>
    </div>

    <!-- Case 挂接管理 -->
    <div class="section d-none" id="caseSection">
      <h6>Case 挂接管理（<span id="caseCount">0</span> 个已挂接）</h6>
      <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
        <select id="linkSelect" class="form-select form-select-sm" style="width:auto;min-width:320px;">
          <option value="">选择要挂接的 Case...</option>
        </select>
        <button id="linkBtn" class="btn btn-primary btn-sm">挂接到本项目</button>
        <span class="text-muted" style="font-size:12px;">挂接后 Case 完成情况自动计入项目进度；换挂将自动从原项目移出。</span>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:180px;">编号</th>
              <th>标题</th>
              <th style="width:100px;">状态</th>
              <th style="width:150px;">创建时间</th>
              <th style="width:110px;">操作</th>
            </tr>
          </thead>
          <tbody id="caseTbody">
            <tr class="empty-row"><td colspan="5">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="section" id="loadingSection">
      <div class="text-center text-muted py-4">加载中...</div>
    </div>
  </div>

  <script src="../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(function () {
      const API = window.EAISELP_API;
      const CFG = window.EAISELP_CONFIG;
      if (!API.getToken()) { location.href = '../' + CFG.LOGIN_PAGE; return; }

      const LAYER_TIP = '该层未启用，请联系管理员在分层设置中开启';
      const PR_TEXT = { planning: '规划中', in_progress: '进行中', delivered: '已交付', closed: '已关闭' };
      const PR_CLASS = { planning: 'pr-planning', in_progress: 'pr-in_progress', delivered: 'pr-delivered', closed: 'pr-closed' };
      const LV_TEXT = { must: '强制', should: '建议', may: '可选' };
      const CS_TEXT = { drafting: '草稿', deriving: '派生中', reviewing: '评审中', testing: '测试中', deploying: '部署中', done: '已完成' };
      const CS_CLASS = { drafting: 'cs-drafting', deriving: 'cs-deriving', reviewing: 'cs-reviewing', testing: 'cs-testing', deploying: 'cs-deploying', done: 'cs-done' };

      const id = (new URLSearchParams(location.search).get('id') || '').trim();
      const projectId = parseInt(id, 10);
      let programMap = null;

      function isLayerOff(resp) { return resp && (resp.code === 43001 || resp.code === 43002); }
      function showTip(msg) {
        $('#loadingSection').addClass('d-none');
        $('#layerTip').removeClass('d-none').text('⚠ ' + (msg || LAYER_TIP));
      }

      function loadAll() {
        if (!id) { showTip('缺少项目 id 参数'); return; }
        API.bizGet('/api/v1/projects/' + encodeURIComponent(id)).done(function (resp) {
          if (isLayerOff(resp)) { showTip(); return; }
          if (resp.code !== 0) { showTip(resp.msg || '加载失败'); return; }
          renderHead(resp.data || {});
          loadCases();
        }).fail(function (xhr) { showTip((xhr.responseJSON && xhr.responseJSON.msg) || ('请求失败（' + xhr.status + '）')); });
      }

      function renderHead(p) {
        $('#loadingSection').addClass('d-none');
        $('#headSection,#principleSection,#caseSection').removeClass('d-none');
        $('#pName').text(p.name || ('项目 #' + id));
        const st = p.status || 'unknown';
        $('#pStatus').html('<span class="status-badge ' + (PR_CLASS[st] || 'pr-unknown') + '">' + (PR_TEXT[st] || st) + '</span>');
        $('#pId').text(p.id || id);
        $('#pProgram').text('-');
        if (p.programId != null) {
          $('#pProgram').text('#' + p.programId + '（加载中）');
          API.bizGet('/api/v1/programs?page=1&size=500').done(function (resp) {
            if (resp.code !== 0 || !resp.data) { $('#pProgram').text('#' + p.programId); return; }
            programMap = {};
            (resp.data.records || []).forEach(function (g) { programMap[g.id] = g.name; });
            $('#pProgram').text(programMap[p.programId] || ('#' + p.programId));
          }).fail(function () { $('#pProgram').text('#' + p.programId); });
        } else {
          $('#pProgram').html('<span class="text-muted">（独立项目，未挂群）</span>');
        }
        $('#pPriority').text(p.priority != null ? p.priority : '-');
        $('#pCreated').text(fmtTime(p.createTime));
        $('#pDesc').text(p.description || '（无描述）');
        const prog = p.progress || 0;
        $('#pProg').text(prog);
        $('#pProgBar').css('width', Math.min(100, Math.max(0, prog)) + '%');
        $('#pDone').text(p.caseDone != null ? p.caseDone : 0);
        $('#pTotal').text(p.caseTotal != null ? p.caseTotal : 0);

        // 已绑定原则（AC-F3.3 展示态：含原则启停与项目级覆盖）
        const principles = p.principles || [];
        if (!principles.length) {
          $('#principleBox').html('<span class="text-muted">未绑定原则，可在"架构原则"管理页绑定本项目</span>');
        } else {
          $('#principleBox').html(principles.map(function (pr) {
            const active = pr.enabled !== false && pr.projectEnabled !== false;
            const tip = [];
            if (pr.enabled === false) tip.push('原则已停用');
            if (pr.projectEnabled === false) tip.push('本项目停用');
            return '<span class="principle-chip' + (active ? '' : ' off') + '" title="' + escapeAttr(pr.title || '') + (tip.length ? '（' + tip.join('，') + '，不注入新编排）' : '') + '">'
              + '<span class="lv">' + (LV_TEXT[pr.enforceLevel] || pr.enforceLevel || '-') + '</span>'
              + escapeHtml(pr.code || '') + ' ' + escapeHtml(pr.title || '')
              + (active ? '' : ' <span style="font-size:11px;">[' + tip.join('，') + ']</span>')
              + '</span>';
          }).join(''));
        }
      }

      // Case 列表：拉全量后按 projectId 前端过滤（/api/v1/cases 暂无 projectId 查询参数）
      function loadCases() {
        const $tb = $('#caseTbody').html('<tr class="empty-row"><td colspan="5">加载中...</td></tr>');
        API.bizGet('/api/v1/cases?page=1&size=500').done(function (resp) {
          if (resp.code !== 0) {
            $tb.html('<tr class="empty-row"><td colspan="5">' + escapeHtml(resp.msg || 'Case 加载失败') + '</td></tr>');
            return;
          }
          const list = (resp.data && (resp.data.records || resp.data.list)) || [];
          const linked = list.filter(function (c) { return c.projectId != null && String(c.projectId) === String(projectId); });
          renderCases(linked);
          renderLinkOptions(list, linked);
        }).fail(function (xhr) {
          $tb.html('<tr class="empty-row"><td colspan="5">' + escapeHtml((xhr.responseJSON && xhr.responseJSON.msg) || 'Case 加载失败') + '</td></tr>');
        });
      }

      function renderCases(linked) {
        $('#caseCount').text(linked.length);
        if (!linked.length) {
          $('#caseTbody').html('<tr class="empty-row"><td colspan="5">暂无挂接 Case，可在上方选择 Case 挂接</td></tr>');
          return;
        }
        $('#caseTbody').html(linked.map(function (c) {
          const st = c.status || 'unknown';
          return '<tr>'
            + '<td><span class="case-code case-open" data-case="' + escapeAttr(c.caseId || '') + '">' + escapeHtml(c.caseId || c.id) + '</span></td>'
            + '<td>' + escapeHtml(c.title || '') + '</td>'
            + '<td><span class="status-badge ' + (CS_CLASS[st] || 'cs-unknown') + '">' + (CS_TEXT[st] || st) + '</span></td>'
            + '<td>' + escapeHtml(fmtTime(c.createTime || c.createdAt)) + '</td>'
            + '<td><button class="btn btn-sm btn-outline-warning case-unlink" data-case="' + escapeAttr(c.caseId || '') + '">解除挂接</button></td></tr>';
        }).join(''));
      }

      function renderLinkOptions(all, linked) {
        const linkedIds = {};
        linked.forEach(function (c) { linkedIds[c.caseId] = true; });
        const candidates = all.filter(function (c) { return !linkedIds[c.caseId]; });
        const $sel = $('#linkSelect').empty().append('<option value="">选择要挂接的 Case...</option>');
        candidates.forEach(function (c) {
          let label = (c.caseId || c.id) + ' ' + (c.title || '');
          if (c.projectId != null) label += '（换挂：当前在项目 #' + c.projectId + '）';
          $sel.append('<option value="' + escapeAttr(c.caseId || '') + '">' + escapeHtml(label) + '</option>');
        });
        if (!candidates.length) $sel.append('<option value="" disabled>（没有可挂接的 Case）</option>');
      }

      // 挂接（换挂时后端自动重算新旧项目，AC-F4.2）
      $('#linkBtn').on('click', function () {
        const caseId = $('#linkSelect').val();
        if (!caseId) { alert('请先选择要挂接的 Case'); return; }
        API.bizPost('/api/v1/projects/' + encodeURIComponent(id) + '/cases/' + encodeURIComponent(caseId), {}).done(function (resp) {
          if (resp.code === 0) {
            // 进度异步重算，稍候刷新展示
            setTimeout(loadAll, 600);
          } else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(resp.msg || '挂接失败'); }
        }).fail(function (xhr) { alert((xhr.responseJSON && xhr.responseJSON.msg) || '挂接失败'); });
      });

      // 解除（任意状态含 done 可解，AC-F8.2 进度回落；解除后异步全量重算）
      $('#caseTbody').on('click', '.case-unlink', function () {
        const caseId = $(this).data('case');
        if (!confirm('确认解除 Case ' + caseId + ' 与本项目的挂接？\n解除后该 Case 保留，但不再计入项目进度。')) return;
        API.bizDelete('/api/v1/projects/' + encodeURIComponent(id) + '/cases/' + encodeURIComponent(caseId)).done(function (resp) {
          if (resp.code === 0) {
            setTimeout(loadAll, 600);
          } else if (isLayerOff(resp)) { alert(LAYER_TIP); }
          else { alert(resp.msg || '解除失败'); }
        }).fail(function (xhr) { alert((xhr.responseJSON && xhr.responseJSON.msg) || '解除失败'); });
      });

      $('#caseTbody').on('click', '.case-open', function () {
        goPage('case-detail', 'Case 详情', 'pages/case-detail.html?caseId=' + encodeURIComponent($(this).data('case')));
      });
      $('#backBtn').on('click', function () { goPage('project-list', '项目管理', 'pages/project-list.html'); });

      function goPage(key, title, page) {
        if (window.self !== window.top && window.parent && window.parent.eaiselpNav) {
          window.parent.eaiselpNav(key, title, page);
        } else {
          location.href = page.replace(/^pages\//, '');
        }
      }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function escapeAttr(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
      function fmtTime(t) {
        if (!t) return '-';
        const d = new Date(typeof t === 'string' ? t.replace('T', ' ') : t);
        if (isNaN(d.getTime())) return String(t);
        const p = function (n) { return n < 10 ? '0' + n : n; };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
          + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }

      loadAll();
    });
  </script>
</body>
</html>
